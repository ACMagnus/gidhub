<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GidHub · 用 GitHub 真的建一个网站</title>
<style>
:root{
  --bg:#ffffff; --bg-sub:#f6f8fa; --border:#d0d7de; --border-soft:#d8dee4;
  --ink:#1f2328; --muted:#59636e; --link:#0969da; --green:#1f883d; --green-hover:#1a7f37;
  --orange:#bc4c00; --red:#cf222e; --header:#0d1117; --header-ink:#e6edf3; --header-muted:#9198a1;
  --radius:6px; --shadow:0 1px 0 rgba(27,31,36,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
svg{display:block}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.wrap.narrow{max-width:1012px}
button,input,textarea,select{font-family:inherit}

/* ===== 顶栏 ===== */
.topbar{background:var(--header);color:var(--header-ink);border-bottom:1px solid #21262d;position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:700;font-size:18px;letter-spacing:.2px;flex:0 0 auto}
.brand:hover{text-decoration:none}
.brand .mark{width:30px;height:30px;border-radius:8px;background:#fff;display:grid;place-items:center;color:#0d1117;font-weight:900;font-size:15px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.topnav{display:flex;align-items:center;gap:2px;margin-left:6px;flex:0 0 auto}
.topnav a{color:var(--header-muted);font-size:14px;padding:7px 10px;border-radius:6px}
.topnav a:hover{color:#fff;background:#21262d;text-decoration:none}
.topnav a.on{color:#fff;background:#21262d}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#21262d;border:1px solid #30363d;border-radius:6px;height:34px;padding:0 10px;width:280px;color:#9198a1;min-width:0}
.search input{background:none;border:0;outline:0;color:#e6edf3;font:inherit;width:100%;min-width:0}
.search input::placeholder{color:#7d8590}
.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.icon-btn{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--header-muted);background:none;border:0;cursor:pointer}
.icon-btn:hover{background:#21262d;color:#fff}
.avatar-xs{width:30px;height:30px;border-radius:50%;overflow:hidden;border:1px solid #30363d;background:#e8c9a0;display:block}
.avatar-xs img,.avatar-xs svg{width:100%;height:100%;object-fit:cover}

/* ===== 通用 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg-sub);color:var(--ink);font:500 13px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:#f0f3f6;text-decoration:none}
.btn.primary{background:var(--green);border-color:#1a7f37;color:#fff;font-weight:600}
.btn.primary:hover{background:var(--green-hover)}
.btn.ghost{background:#fff}
.btn.danger{color:var(--red);border-color:#ffcecb;background:#fff}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn.lg{height:40px;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.6;cursor:default}
.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--muted);font-weight:500;line-height:18px;vertical-align:2px}
.pill.green{color:#1a7f37;border-color:#aceebb;background:#dafbe1}
.pill.orange{color:#9a6700;border-color:#eac54f;background:#fff8c5}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#b07219;margin-right:5px;vertical-align:-1px}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}

/* ===== 首页 ===== */
.home{padding:32px 0 56px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center;padding:18px 0 40px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font:600 12px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:#1a7f37;background:#dafbe1;border:1px solid #aceebb;border-radius:999px;padding:6px 10px;margin-bottom:18px}
.hero h1{font-size:44px;line-height:1.15;letter-spacing:-1px;margin:0 0 16px;font-weight:700}
.hero p{font-size:16px;line-height:1.7;color:#3d444d;margin:0 0 22px;max-width:540px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.hero-meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.hero-meta span{display:flex;align-items:center;gap:6px}
.hero-shot{border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 16px 36px rgba(31,35,40,.10);background:#fff}
.shot-bar{height:30px;background:#f6f8fa;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:5px;padding:0 10px}
.shot-bar i{width:8px;height:8px;border-radius:50%;background:#d0d7de;display:block}
.shot-bar .url{margin-left:8px;height:18px;flex:1;border:1px solid var(--border-soft);border-radius:4px;background:#fff;color:#8c959f;font:11px/18px ui-monospace,monospace;padding:0 7px;overflow:hidden;white-space:nowrap}
.shot-body{padding:34px 32px 30px;background:linear-gradient(180deg,#ffffff 0%,#f6f8fa 100%);min-height:286px;display:flex;flex-direction:column;justify-content:center}
.shot-body .kicker{font:600 11px/1 ui-monospace,monospace;letter-spacing:.12em;color:#1a7f37;margin-bottom:14px}
.shot-body h2{font-size:30px;line-height:1.2;margin:0 0 10px;letter-spacing:-.5px}
.shot-body p{font-size:14px;color:#59636e;max-width:360px;margin:0 0 22px}
.shot-body .fake-btn{display:inline-flex;align-items:center;height:32px;padding:0 14px;background:#1f883d;color:#fff;border-radius:6px;font-size:13px;font-weight:600;width:max-content}
.shot-note{padding:10px 14px;border-top:1px solid var(--border-soft);font-size:11px;color:#8c959f;background:#fff}

.home-body{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:32px;margin-top:8px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 12px}
.section-head h2{font-size:18px;margin:0;font-weight:600}
.repo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.repo-card{border:1px solid var(--border);border-radius:8px;padding:16px;background:#fff;display:flex;flex-direction:column;min-height:128px}
.repo-card:hover{border-color:#afb8c1}
.repo-card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.repo-card .top svg{color:#656d76;flex:0 0 16px}
.repo-card h3{font-size:15px;margin:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo-card h3 a{color:var(--link)}
.repo-card p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.repo-card .foot{margin-top:auto;display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}
.repo-card .foot span,.pinned .foot span,.result-row .meta span{display:inline-flex;align-items:center;gap:4px}
.repo-card .foot .pages{color:#1a7f37}
.empty-line{border:1px dashed var(--border);border-radius:8px;padding:32px;text-align:center;color:var(--muted);background:#fff}
.side-steps{border:1px solid var(--border);border-radius:8px;padding:18px;background:#fff;height:max-content}
.side-steps h3{font-size:14px;margin:0 0 14px}
.step{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft)}
.step:last-child{border-bottom:0;padding-bottom:0}
.step .n{width:22px;height:22px;border-radius:50%;background:#dafbe1;color:#1a7f37;font-weight:700;font-size:12px;display:grid;place-items:center;flex:0 0 22px;margin-top:2px}
.step b{display:block;font-size:13px;font-weight:600}
.step span{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.connect-banner{display:flex;gap:12px;align-items:center;border:1px solid #eac54f;background:#fff8c5;border-radius:8px;padding:12px 14px;margin:0 0 20px;font-size:13px;color:#7d4e00}
.connect-banner .grow{flex:1}
.connect-banner a{color:#7d4e00;font-weight:600;white-space:nowrap}

/* ===== 表单 / 页面 ===== */
.page{padding:28px 0 60px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
.page-head h1{font-size:24px;margin:0 0 6px;font-weight:600}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.panel{border:1px solid var(--border);border-radius:8px;background:#fff}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border-soft)}
.panel-h h2{font-size:14px;margin:0;font-weight:600}
.panel-b{padding:16px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field .hint{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:5px;line-height:1.5}
.input,textarea.input,select.input{width:100%;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);padding:8px 10px;font-size:14px;outline:none;line-height:1.5}
.input:focus,textarea.input:focus,select.input:focus{border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.12)}
textarea.input{min-height:96px;resize:vertical}
.input.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.repo-name-row{display:flex;align-items:center;gap:6px}
.repo-name-row .owner{white-space:nowrap;flex:0 0 auto}
.repo-name-row .input{flex:1;min-width:0}
.repo-name-row .suffix{white-space:nowrap;flex:0 0 auto}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink);margin-bottom:8px}
.check input{margin-top:3px}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:20px}

/* ===== 建站 ===== */
.new-grid{display:grid;grid-template-columns:440px minmax(0,1fr);gap:24px;align-items:start}
.form-card{border:1px solid var(--border);border-radius:8px;background:#fff;padding:18px}
.preview-wrap{position:sticky;top:84px}
.preview-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(31,35,40,.06)}
.preview-bar{height:34px;background:#f6f8fa;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--muted);font-size:11px}
.preview-bar i{width:8px;height:8px;border-radius:50%;background:#d0d7de}
.preview-bar .grow{flex:1;text-align:center;font-family:ui-monospace,monospace}
.preview-frame{height:min(600px,calc(100vh - 150px));min-height:420px;background:#fff}
.preview-frame iframe{width:100%;height:100%;border:0;display:block}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tpl{position:relative;border:1px solid var(--border);border-radius:6px;padding:10px;cursor:pointer;background:#fff}
.tpl input{position:absolute;opacity:0;pointer-events:none}
.tpl:has(input:checked){border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.12);background:#f6f8fa}
.tpl b{display:block;font-size:12px;margin-bottom:2px}
.tpl span{display:block;font-size:11px;color:var(--muted)}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--border);cursor:pointer;padding:0}
.swatch[data-on="1"]{box-shadow:0 0 0 2px #0969da}
.color-input{width:44px;height:30px;padding:2px;border:1px solid var(--border);border-radius:6px;background:#fff}
.build-card{border:1px solid var(--border);border-radius:8px;background:#fff;padding:16px;margin-top:18px}
.build-card h3{font-size:14px;margin:0 0 12px}
.log-line{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:5px 0;color:#3d444d}
.log-line .ic{width:16px;height:16px;flex:0 0 16px;margin-top:2px;color:var(--muted)}
.log-line.ok .ic{color:#1a7f37}
.log-line.err .ic{color:var(--red)}
.result-url{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
.result-url a{font-size:15px;font-weight:600;word-break:break-all}
.build-result{border:1px solid #aceebb;background:#dafbe1;border-radius:8px;padding:14px;margin-top:12px}
.build-result b{display:block;font-size:14px;margin-bottom:4px}
.build-result .r-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ===== 连接 ===== */
.gate{max-width:620px;margin:0 auto;text-align:center;padding:48px 0}
.gate .lock{width:56px;height:56px;border-radius:50%;background:#f6f8fa;border:1px solid var(--border);display:grid;place-items:center;margin:0 auto 18px;color:#656d76}
.gate h1{font-size:24px;margin:0 0 10px}
.gate p{color:var(--muted);line-height:1.7;margin:0 auto 22px;max-width:480px}
.connect-box{max-width:640px;margin:0 auto}
.token-row{display:flex;gap:8px}
.token-row .input{flex:1}
.warn{border:1px solid #eac54f;background:#fff8c5;color:#7d4e00;border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.6;margin:0 0 16px}
.ok-box{border:1px solid #aceebb;background:#dafbe1;border-radius:8px;padding:12px 14px;font-size:13px;color:#116329;margin-bottom:16px}
.err-box{border:1px solid #ffcecb;background:#ffebe9;border-radius:8px;padding:10px 12px;font-size:13px;color:#a40e26;margin-top:12px}
.scope-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.scope{font:11px/18px ui-monospace,monospace;border:1px solid var(--border);border-radius:999px;padding:0 8px;color:var(--muted);background:#fff}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px;margin:14px 0}
.kv .k{color:var(--muted)}

/* ===== 个人主页 ===== */
.profile{padding:32px 0 56px}
.profile-grid{display:grid;grid-template-columns:296px 1fr;gap:32px}
.avatar-xl{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:1px solid var(--border);background:#e8c9a0;margin-bottom:18px}
.avatar-xl img,.avatar-xl svg{width:100%;height:100%;object-fit:cover}
.profile h1{font-size:26px;font-weight:600;margin:0 0 4px}
.profile .handle{color:var(--muted);font-size:16px;margin-bottom:14px}
.profile .bio{color:#3d444d;margin:0 0 16px;line-height:1.6;white-space:pre-wrap}
.profile .meta{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:13px;margin-bottom:18px}
.profile .meta span{display:flex;align-items:center;gap:8px;word-break:break-all}
.profile .meta b{color:var(--ink);font-weight:600}
.profile .follow{display:flex;gap:8px;flex-wrap:wrap}
.pinned{border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;background:#fff}
.pinned:hover{border-color:#afb8c1}
.pinned h3{margin:0 0 6px;font-size:16px;font-weight:600}
.pinned h3 a{color:var(--link)}
.pinned p{margin:0 0 12px;color:var(--muted);font-size:13px}
.pinned .foot{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.repo-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid var(--border-soft)}
.repo-row:last-child{border-bottom:0;padding-bottom:0}
.repo-row h3{margin:0 0 4px;font-size:15px;font-weight:600}
.repo-row p{margin:0 0 8px;color:var(--muted);font-size:13px}
.repo-row .foot{display:flex;gap:16px;color:var(--muted);font-size:12px;flex-wrap:wrap}

/* ===== 仓库页 ===== */
.repo-head{padding:22px 0 0}
.repo-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:20px}
.repo-title .owner{color:var(--muted);font-weight:400}
.repo-title .name{color:var(--link);font-weight:600}
.repo-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;margin-top:18px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs a{display:flex;align-items:center;gap:6px;padding:10px 14px 9px;color:var(--muted);font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{background:#f6f8fa;color:var(--ink);text-decoration:none}
.tabs a.active{color:var(--ink);font-weight:600;border-bottom-color:#fd8c73}
.tabs .num{background:#eaeef2;border-radius:999px;padding:0 7px;font-size:12px;color:#1f2328;font-weight:600}
.repo-grid{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px;padding:24px 0 48px}
.branchbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-soft);background:#fff;border-radius:8px 8px 0 0;flex-wrap:wrap}
.select{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-sub);font-weight:600;font-size:13px}
.branchbar .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:12px;background:#fff;text-decoration:none}
.mini:hover{background:#f6f8fa;text-decoration:none;color:var(--ink)}
.mini.primary{background:var(--green);border-color:#1a7f37;color:#fff}
.mini.primary:hover{background:var(--green-hover);color:#fff}
.filelist{border:1px solid var(--border);border-top:0;border-radius:0 0 8px 8px;overflow:hidden;background:#fff}
.commit-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border-soft);background:#fff;font-size:12px;color:var(--muted);min-width:0}
.commit-head b{color:#1f2328;flex:0 0 auto}
.commit-head span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.commit-head .sha{margin-left:auto;font-family:ui-monospace,monospace;flex:0 0 auto}
.filelist table{width:100%;border-collapse:collapse}
.filelist tr{border-bottom:1px solid var(--border-soft)}
.filelist tr:last-child{border-bottom:0}
.filelist tr:hover{background:#f6f8fa}
.filelist td{padding:8px 12px;vertical-align:middle}
.filelist td.name{width:42%;font-size:13px}
.filelist td.name a{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.filelist td.name a:hover{color:var(--link);text-decoration:none}
.filelist td.msg{color:var(--muted);font-size:12px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filelist td.when{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.ficon{width:16px;height:16px;flex:0 0 16px}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;margin:0 0 12px;flex-wrap:wrap}
.breadcrumb a,.breadcrumb span.sep{color:var(--link)}
.breadcrumb .current{color:var(--muted)}
.readme{border:1px solid var(--border);border-radius:8px;margin-top:20px;overflow:hidden;background:#fff}
.readme-h{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#f6f8fa;border-bottom:1px solid var(--border);font-size:13px;font-weight:600}
.readme-b{padding:24px 32px;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.md h1{font-size:24px;margin:0 0 12px;font-weight:600}
.md h2{font-size:18px;margin:26px 0 10px;font-weight:600;border-bottom:1px solid var(--border-soft);padding-bottom:6px}
.md h3{font-size:16px;margin:20px 0 8px}
.md p{color:#3d444d;line-height:1.7;margin:0 0 12px}
.md ul,.md ol{margin:0 0 14px;padding-left:22px;color:#3d444d}
.md li{margin:4px 0}
.md code{background:#eff1f3;border-radius:4px;padding:1px 5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.md pre{background:#f6f8fa;border:1px solid var(--border);border-radius:6px;padding:12px;overflow:auto;margin:0 0 14px}
.md pre code{background:none;padding:0;font-size:12px}
.md img{max-width:100%;border-radius:6px}
.md blockquote{border-left:3px solid var(--border);margin:0 0 12px;padding:0 0 0 14px;color:var(--muted)}
.side-card{border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;background:#fff}
.side-card h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.side-card p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.6}
.side-card a{font-size:13px}
.side-list{display:flex;flex-direction:column;gap:10px}
.side-list .row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.side-list .row b{color:var(--ink);font-weight:600}
.side-list .row .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.release-line{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border-soft)}

.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:#fff;font:600 12px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#1f2328}
.latest{font-size:11px;border:1px solid #d4a72c;color:#9a6700;background:#fff8c5;border-radius:999px;padding:1px 7px;font-weight:600}
.avatar-s{width:26px;height:26px;border-radius:50%;overflow:hidden;background:#e8c9a0;border:1px solid var(--border);flex:0 0 26px;display:block}
.avatar-s img,.avatar-s svg{width:100%;height:100%;object-fit:cover}
.lang-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#eaeef2;margin:4px 0 10px}
.lang-bar i{display:block;height:100%}

/* ===== 文件 / 编辑 ===== */
.file-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--border);border-radius:8px 8px 0 0;background:#fff;flex-wrap:wrap}
.file-head .path{font:600 13px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;word-break:break-all}
.file-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.file-body{border:1px solid var(--border);border-top:0;border-radius:0 0 8px 8px;background:#fff;overflow:auto}
.code-view{margin:0;padding:0;font:12.5px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;min-width:100%;display:flex}
.linenos{flex:0 0 auto;padding:14px 10px 14px 14px;color:#8c959f;text-align:right;user-select:none;border-right:1px solid #eaeef2;background:#f6f8fa;white-space:pre}
.code-lines{flex:1;padding:14px 16px;white-space:pre;overflow:visible}
.binary{padding:28px;text-align:center;color:var(--muted)}
.binary img{max-width:100%;max-height:70vh;margin:0 auto;display:block}
.edit-card{border:1px solid var(--border);border-radius:8px;background:#fff;overflow:hidden}
.edit-card .hd{padding:12px 16px;border-bottom:1px solid var(--border-soft);background:#f6f8fa;font-size:13px;font-weight:600}
.edit-card .bd{padding:16px}
.code-input{width:100%;min-height:460px;border:1px solid var(--border);border-radius:6px;padding:12px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical;background:#fff;color:var(--ink);outline:none}
.code-input:focus{border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.12)}
.editor-note{font-size:12px;color:var(--muted);margin-top:6px}

/* ===== Releases / Issues ===== */
.subpage{padding:24px 0 60px}
.subhead{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.subhead h1{font-size:20px;margin:0;font-weight:600}
.release-card{border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;background:#fff}

.asset b{font-size:13px;word-break:break-all}

.issue-row .grow{flex:1;min-width:0}
.issue-row b{font-size:14px;font-weight:600}
.issue-row b a{color:var(--ink)}
.issue-row .meta{color:var(--muted);font-size:12px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.issue-form{border:1px solid var(--border);border-radius:8px;background:#fff;padding:16px;margin-bottom:18px}
.issue-form h3{font-size:14px;margin:0 0 12px}

/* ===== 搜索 ===== */
.search-page{max-width:980px;margin:0 auto}
.search-form{display:flex;gap:8px;margin-bottom:20px}
.search-form .input{flex:1}
.result-row{border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;background:#fff}
.result-row:hover{border-color:#afb8c1}
.result-row h3{margin:0 0 4px;font-size:16px;font-weight:600}
.result-row h3 a{color:var(--link)}
.result-row p{margin:0 0 8px;color:var(--muted);font-size:13px}
.result-row .meta{display:flex;gap:16px;color:var(--muted);font-size:12px;flex-wrap:wrap}

/* ===== 加载 / 提示 ===== */
.loading-page{display:flex;align-items:center;justify-content:center;gap:10px;min-height:320px;color:var(--muted);font-size:13px}
.spinner{width:16px;height:16px;border:2px solid #d0d7de;border-top-color:#0969da;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1f2328;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{border-top:1px solid var(--border-soft);margin-top:24px;padding:24px 0 40px;color:var(--muted);font-size:12px}
footer .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}

<script>

const API = 'https://api.github.com';

/* ===== 基础工具 ===== */
function esc(value){
  return String(value == null ? '' : value)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeUrl(value, fallback){
  try{
    const u = new URL(String(value), 'https://github.com/');
    if (u.protocol === 'http:' || u.protocol === 'https:') return esc(u.href);
  }catch(_){}
  return fallback || '#';
}
function timeAgo(iso){
  if(!iso) return '';
  const t = new Date(iso).getTime();
  if(!t) return '';
  const diff = Math.floor((Date.now() - t) / 1000);
  if(diff < 60) return '刚刚';
  if(diff < 3600) return Math.floor(diff/60) + ' 分钟前';
  if(diff < 86400) return Math.floor(diff/3600) + ' 小时前';
  if(diff < 2592000) return Math.floor(diff/86400) + ' 天前';
  if(diff < 31536000) return Math.floor(diff/2592000) + ' 个月前';
  return Math.floor(diff/31536000) + ' 年前';
}
function fmtBytes(n){
  n = Number(n) || 0;
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  if(n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + ' MB';
  return (n/1024/1024/1024).toFixed(2) + ' GB';
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64){
  const clean = String(b64 || '').replace(/\s/g,'');
  const bin = atob(clean);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function encodePath(path){
  return String(path || '').split('/').filter(Boolean).map(encodeURIComponent).join('/');
}
async function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function showToast(text){
  const el = document.getElementById('toast');

  showToast._t = setTimeout(() => el.classList.remove('show'), 1800);
}

function icon(name, size, cls){
  const s = size || 16;
  const paths = ICONS[name] || '';
  return '<svg class="' + (cls || '') + '" width="' + s + '" height="' + s + '" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' + paths + '</svg>';

function avatar(url, login, cls){

/* ===== API ===== */
function apiErrorMessage(e){
  if(!e) return '未知错误';
  if(e.status === 401) return 'GitHub key 无效或已过期';
  if(e.status === 403){
    const remain = state.lastHeaders && state.lastHeaders.get('x-ratelimit-remaining');
    if(remain === '0') return 'GitHub API 限额已用完，连接自己的 key 可提高额度';
    if(/scope|permission/i.test(e.message || '')) return 'key 权限不足：' + e.message;
    return '没有权限执行这个操作：' + (e.message || '403');
  }
  if(e.status === 404) return '没有找到：' + (e.message || '404');
  if(e.status === 409) return '冲突：' + (e.message || '409');
  if(e.status === 422) return 'GitHub 拒绝了这次操作：' + (e.message || '422');
  if(e.status >= 500) return 'GitHub 服务暂时出错（' + e.status + '）';
  return e.message || ('HTTP ' + (e.status || '错误'));
}

async function api(path, opts){
  opts = opts || {};
  const url = path.startsWith('http') ? path : API + path;
  const headers = Object.assign({
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  }, opts.headers || {});
  if(state.token) headers['Authorization'] = 'Bearer ' + state.token;
  let body = opts.body;
  if(body && typeof body === 'object' && !(body instanceof FormData)){
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify(body);
  }
  let res;
  try{
    res = await fetch(url, Object.assign({}, opts, {headers, body}));
  }catch(networkError){
    const err = new Error('网络请求失败，检查网络或代理');
    err.status = 0; err.cause = networkError;
    throw err;
  }
  state.lastHeaders = res.headers;
  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(_){ data = text; }
  if(!res.ok){
    const err = new Error((data && data.message) || ('HTTP ' + res.status));
    err.status = res.status; err.data = data; err.headers = res.headers;
    throw err;
  }
  return data;
}

async function cached(path, ttl){
  const key = path + (state.token ? '|auth' : '|anon');
  const hit = state.cache.get(key);
  if(hit && Date.now() - hit.at < (ttl || 60000)) return hit.value;
  const value = await api(path);
  state.cache.set(key, {at: Date.now(), value});
  return value;
}
function clearCache(){ state.cache.clear(); }

async function safeFetch(path, fallback){
  try{ return await cached(path); }catch(e){ if(e.status === 404 || e.status === 204 || e.status === 451) return fallback; throw e; }
}

async function verifyToken(token){
  const headers = {
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    'Authorization': 'Bearer ' + token
  };
  const res = await fetch(API + '/user', {headers});
  state.lastHeaders = res.headers;
  const text = await res.text();
  let data = null; try{ data = text ? JSON.parse(text) : null; }catch(_){}
  if(!res.ok){
    const err = new Error((data && data.message) || ('HTTP ' + res.status));
    err.status = res.status; throw err;
  }
  return data;
}

    try{ return decodeURIComponent(s); }catch(_){ return s; }
  });
  return {seg, q: new URLSearchParams(parts.slice(1).join('?'))};
}

/* ===== Markdown（够用即可） ===== */
function mdInline(text){
  let s = esc(text);
  s = s.replace(/`([^`]+)`/g, (m, c) => '<code>' + c + '</code>');
  s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, (m, alt, src) => '<img src="' + safeUrl(src) + '" alt="' + alt + '" loading="lazy">');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, label, href) => '<a href="' + safeUrl(href) + '" target="_blank" rel="noopener">' + label + '</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/__([^_]+)__/g, '<b>$1</b>');
  s = s.replace(/\*([^*]+)\*/g, '<i>$1</i>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return s;
}
function markdown(src, base){
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  let out = [];
  let inCode = false, code = [], codeLang = '';
  let list = null;
  const closeList = () => { if(list){ out.push('</' + list + '>'); list = null; } };
  const rewriteImage = (html) => {
    if(!base) return html;
    return html.replace(/<img src="([^"]+)" alt="([^"]*)"/g, (m, src, alt) => {
      if(/^https?:/.test(src)) return m;
      const raw = 'https://raw.githubusercontent.com/' + base.owner + '/' + base.repo + '/' + encodeURIComponent(base.branch) + '/' + encodePath(base.path ? base.path + '/' + src : src);
      return '<img src="' + raw + '" alt="' + alt + '" loading="lazy">';
    });
  };
  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    if(inCode){
      if(/^```/.test(line.trim()) || /^~~~/.test(line.trim())){
        inCode = false;
        out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
        code = []; codeLang = '';
      }else{
        code.push(line);
      }
      continue;
    }
    if(/^```/.test(line.trim()) || /^~~~/.test(line.trim())){
      closeList();
      inCode = true; codeLang = line.trim().replace(/^[`~]+/, '').trim();
      continue;
    }
    if(!line.trim()){ closeList(); out.push(''); continue; }
    const hm = line.match(/^(#{1,6})\s+(.+)$/);
    if(hm){
      closeList();
      const level = Math.min(hm[1].length, 3);
      out.push('<h' + level + '>' + mdInline(hm[2]) + '</h' + level + '>');
      continue;
    }
    if(/^\s*[>*+-]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)){
      const ordered = /^\s*\d+\.\s+/.test(line);
      const want = ordered ? 'ol' : 'ul';
      if(list !== want){ closeList(); list = want; out.push('<' + want + '>'); }
      out.push('<li>' + mdInline(line.replace(/^\s*[>*+-]\s+/, '').replace(/^\s*\d+\.\s+/, '')) + '</li>');
      continue;
    }
    closeList();
    out.push('<p>' + mdInline(line) + '</p>');
  }
  if(inCode){ out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); }
  closeList();
  return '<div class="md">' + rewriteImage(out.join('\n')) + '</div>';
}

          '</div></div>' +
        '<div class="filelist">' +
          '<div class="commit-head">' + avatar(latest && latest.author ? latest.author.avatar_url : null, latest && latest.author ? latest.author.login : owner, 'avatar-s') +

            '<span>' + esc(latest && latest.commit ? latest.commit.message.split('\n')[0] : '暂无提交') + '</span>' +
            (latest ? '<span class="sha">' + esc(String(latest.sha).slice(0,7)) + ' · ' + timeAgo(latest.commit && latest.commit.author ? latest.commit.author.date : null) + '</span>' : '') +
          '</div>' +
          '<table>' + (rows || '<tr><td class="name" colspan="3" style="color:var(--muted);padding:18px">这个文件夹是空的。</td></tr>') + '</table>' +
        '</div>' +
        (readme ? '<div class="readme"><div class="readme-h">' + icon('file',16) + ' ' + esc(readmeName) + '</div><div class="readme-b">' + markdown(readme, {owner, repo, branch: branchName, path: path || ''}) + '</div></div>' : '') +
      '</div>' +
      '<aside>' +
        '<div class="side-card"><h3>About</h3><p>' + esc(repoData.description || '没有填写简介。') + '</p>' +
          (repoData.homepage ? '<p><a href="' + safeUrl(repoData.homepage) + '" target="_blank" rel="noopener">' + esc(repoData.homepage.replace(/^https?:\/\//,'')) + '</a></p>' : '') +
          (pagesUrl ? '<p><a href="' + safeUrl(pagesUrl) + '" target="_blank" rel="noopener">' + icon('globe',12) + ' ' + esc(pagesUrl.replace(/^https:\/\//,'')) + '</a></p>' : '') +
          '<div class="side-list">' +
            (langRows.length ? '<div><div class="lang-bar">' + langRows.map(([name, bytes]) => '<i style="width:' + Math.max(2, bytes/langTotal*100) + '%;background:' + langColor(name) + '"></i>').join('') + '</div>' + langRows.map(([name, bytes]) => '<div class="row"><i class="dot" style="background:' + langColor(name) + '"></i><span class="grow">' + esc(name) + '</span><b>' + (bytes/langTotal*100).toFixed(1) + '%</b></div>').join('') + '</div>' : '') +
            '<div class="row">' + icon('star',14) + ' <b>' + (repoData.stargazers_count||0) + '</b> stars · <b>' + (repoData.forks_count||0) + '</b> forks</div>' +
            '<div class="row">' + icon('issue',14) + ' <b>' + issueCount + '</b> open issues</div>' +
            '<div class="row">' + icon('lock',14) + ' ' + (repoData.license ? esc(repoData.license.name) : '未声明许可') + '</div>' +
          '</div></div>' +
        (releases && releases.length ? '<div class="side-card"><h3>Releases <a class="small" href="' + repoHash(owner, repo) + '/releases">全部</a></h3>' +
          releases.map((r, i) => '<div class="release-line"><div><span class="tag">' + esc(r.tag_name) + '</span>' + (i===0 ? ' <span class="latest">Latest</span>' : '') + '<div class="small muted" style="margin-top:6px">' + timeAgo(r.published_at) + '</div></div></div>').join('') + '</div>' : '') +
        '<div class="side-card"><h3>Contributors</h3><div class="side-list">' +
          ((contributors && contributors.length) ? contributors.slice(0,5).map(c => '<div class="row">' + avatar(c.avatar_url, c.login, 'avatar-s') + ' <span class="grow"><b>' + esc(c.login) + '</b></span><span>' + (c.contributions||0) + '</span></div>').join('') : '<div class="row">暂无贡献者数据</div>') +
        '</div></div>' +
      '</aside>' +
    '</div>' +
  '</section>';
}
function langColor(name){
  const map = {JavaScript:'#f1e05a',TypeScript:'#3178c6',HTML:'#e34c26',CSS:'#563d7c',Java:'#b07219',Python:'#3572A5',Shell:'#89e051',Go:'#00ADD8',Rust:'#dea584',C:'#555555','C++':'#f34b7d',Ruby:'#701516',PHP:'#4F5D95',Kotlin:'#A97BFF',Swift:'#F05138'};
  return map[name] || '#8c959f';
}

/* ===== 文件 ===== */
async function viewBlob(owner, repo, path, branch){
  const full = '/' + owner + '/' + repo;
  const repoData = await loadRepo(owner, repo);
  const branchName = branch || repoData.default_branch || 'main';
  const [item, latestCommit] = await Promise.all([
    cached('/repos' + full + '/contents/' + encodePath(path) + '?ref=' + encodeURIComponent(branchName)),
    safeFetch('/repos' + full + '/commits?path=' + encodeURIComponent(path) + '&per_page=1&sha=' + encodeURIComponent(branchName), [])
  ]);
  if(Array.isArray(item)){
    location.hash = repoHash(owner, repo) + '/tree/' + encodePath(path) + '?branch=' + encodeURIComponent(branchName);
    return '';
  }
  const textExt = /\.(md|txt|json|yml|yaml|html|htm|css|js|jsx|ts|tsx|java|py|sh|bat|cmd|xml|gradle|properties|toml|ini|cfg|gitignore|yml)$/i.test(item.name) || !/\.(png|jpg|jpeg|gif|webp|ico|pdf|zip|jar|exe|dll|class|ttf|woff|woff2|mp4|mp3)$/i.test(item.name);
  let content = '';
  if(textExt && item.size < 2*1024*1024){
    try{ content = b64decode(item.content); }catch(_){ content = ''; }
  }
  const latest = latestCommit && latestCommit[0];
  const canEdit = state.me && repoData.permissions && repoData.permissions.push;
  const body = textExt
    ? '<div class="code-view"><div class="linenos">' + content.split('\n').map((_, i) => i+1).join('\n') + '</div><div class="code-lines">' + esc(content) + '</div></div>'
    : (item.download_url && /\.(png|jpg|jpeg|gif|webp|ico)$/i.test(item.name) ? '<div class="binary"><img src="' + safeUrl(item.download_url) + '" alt="' + esc(item.name) + '"></div>' : '<div class="binary">' + icon('file',36,'') + '<p>二进制文件 · ' + fmtBytes(item.size) + '</p><a class="btn" href="' + safeUrl(item.download_url) + '" target="_blank" rel="noopener">下载</a></div>');

  return '<section class="repo wrap">' +
    '<div class="repo-head"><div class="repo-title"><span class="owner">' + esc(owner) + '</span><span>/</span><span class="name"><a href="' + repoHash(owner, repo) + '">' + esc(repo) + '</a></span><span class="pill">' + (repoData.private ? 'Private' : 'Public') + '</span>' +
      '<div class="repo-actions"><a class="btn ghost" href="' + repoHash(owner, repo) + '">' + icon('arrow',16) + ' 返回仓库</a></div></div>' +
      '<nav class="tabs"><a class="active" href="' + repoHash(owner, repo) + '">Code</a><a href="' + repoHash(owner, repo) + '/issues">Issues <span class="num">' + (repoData.open_issues_count||0) + '</span></a><a href="' + repoHash(owner, repo) + '/releases">Releases</a></nav>' +
    '</div>' +
    '<div class="repo-grid"><div>' +
      '<div class="breadcrumb"><a href="' + repoHash(owner, repo) + '">' + esc(repo) + '</a>' + String(path).split('/').filter(Boolean).map((p, i, arr) => '<span class="sep">/</span>' + (i === arr.length - 1 ? '<span class="current">' + esc(p) + '</span>' : '<span>' + esc(p) + '</span>')).join('') + '</div>' +
      '<div class="file-head"><span class="ficon" style="color:#656d76">' + icon('file',18) + '</span><span class="path">' + esc(item.path) + '</span><span class="muted small">' + fmtBytes(item.size) + '</span>' +
        '<div class="right">' + (canEdit ? '<a class="mini" href="' + repoHash(owner, repo) + '/edit/' + encodeURI(item.path) + '?branch=' + encodeURIComponent(branchName) + '">编辑</a>' : '') +
          '<a class="mini" href="' + safeUrl(item.download_url) + '" target="_blank" rel="noopener">原始文件</a>' +
          '<a class="mini" href="' + safeUrl(repoData.html_url) + '/blob/' + encodeURIComponent(branchName) + '/' + encodePath(item.path) + '" target="_blank" rel="noopener">' + icon('external',14) + '</a></div></div>' +
      '<div class="file-body">' + body + '</div>' +
      (latest ? '<div class="muted small" style="margin-top:10px">最近提交：' + esc(latest.commit.message.split('\n')[0]) + ' · ' + timeAgo(latest.commit.author.date) + ' · ' + esc(String(latest.sha).slice(0,7)) + '</div>' : '') +
    '</div><aside>' +
      '<div class="side-card"><h3>文件</h3><div class="side-list">' +
        '<div class="row">' + icon('file',14) + ' <span class="grow">' + esc(item.name) + '</span></div>' +
        '<div class="row">' + icon('clock',14) + ' ' + (latest ? timeAgo(latest.commit.author.date) : '') + '</div>' +
        '<div class="row">' + icon('download',14) + ' <a href="' + safeUrl(item.download_url) + '" target="_blank" rel="noopener">下载原文件</a></div>' +
      '</div></div>' +
    '</aside></div></section>';
}

/* ===== 编辑文件 ===== */
async function viewEdit(owner, repo, path, branch){
  if(!state.me) return authGate('改文件需要先连接 GitHub key。');
  const repoData = await loadRepo(owner, repo);
  const branchName = branch || repoData.default_branch || 'main';
  let item = null, content = '', sha = '';
  if(path){
    item = await cached('/repos/' + owner + '/' + repo + '/contents/' + encodePath(path) + '?ref=' + encodeURIComponent(branchName));
    if(Array.isArray(item)) throw new Error('路径是文件夹，不能编辑');
    content = b64decode(item.content); sha = item.sha;
  }
  return '<section class="page wrap narrow">' +
    '<div class="page-head"><div><h1>' + (path ? '编辑文件' : '新建文件') + '</h1><p>' + esc(owner) + ' / ' + esc(repo) + (path ? ' · ' + esc(path) : '') + '</p></div><a class="btn ghost" href="' + (path ? repoHash(owner, repo) + '/blob/' + encodeURI(path) + '?branch=' + encodeURIComponent(branchName) : repoHash(owner, repo)) + '">取消</a></div>' +
    '<form id="fileForm" data-owner="' + esc(owner) + '" data-repo="' + esc(repo) + '" data-branch="' + esc(branchName) + '" data-sha="' + esc(sha) + '" data-old="' + esc(path || '') + '">' +
      '<div class="edit-card"><div class="hd">' + esc(path || '新文件') + '</div><div class="bd">' +
        '<div class="field"><label for="filePath">文件路径</label><input class="input mono" id="filePath" name="path" value="' + esc(path || '') + '" placeholder="例如 index.html" ' + (path ? 'readonly' : '') + ' required></div>' +
        '<div class="field"><label for="fileContent">内容</label><textarea class="code-input" id="fileContent" name="content" spellcheck="false" required>' + esc(content) + '</textarea><div class="editor-note">保存后会直接提交到 ' + esc(branchName) + ' 分支，生成一次真实 commit。</div></div>' +
        '<div class="field"><label for="commitMsg">提交信息</label><input class="input" id="commitMsg" name="message" value="' + (path ? 'update ' + esc(path) : 'add file') + '" required></div>' +
        '<div class="form-actions"><button class="btn primary" type="submit">提交更改</button>' +
          (path ? '<button class="btn danger" type="button" data-action="delete-file" data-owner="' + esc(owner) + '" data-repo="' + esc(repo) + '" data-path="' + esc(path) + '" data-branch="' + esc(branchName) + '" data-sha="' + esc(sha) + '">删除文件</button>' : '') +
          '<a class="btn ghost" href="' + (path ? repoHash(owner, repo) + '/blob/' + encodeURI(path) + '?branch=' + encodeURIComponent(branchName) : repoHash(owner, repo)) + '">取消</a></div>' +
        '<div id="fileMsg"></div>' +
      '</div></div>' +
    '</form></section>';
}

    '<div class="repo-head"><div class="repo-title"><span class="owner">' + esc(owner) + '</span><span>/</span><span class="name"><a href="' + repoHash(owner, repo) + '">' + esc(repo) + '</a></span><span class="pill">' + (repoData.private ? 'Private' : 'Public') + '</span></div>' +
      '<nav class="tabs"><a href="' + repoHash(owner, repo) + '">Code</a><a class="active" href="' + repoHash(owner, repo) + '/issues">Issues <span class="num">' + (repoData.open_issues_count||0) + '</span></a><a href="' + repoHash(owner, repo) + '/releases">Releases</a></nav></div>' +
    '<div class="repo-grid"><div>' +
      '<div class="subhead"><h1>Issues</h1><span class="pill green">' + (repoData.open_issues_count||0) + ' Open</span>' +
        '<div style="margin-left:auto;display:flex;gap:8px">' + (canIssue ? '<button class="btn primary" data-action="toggle-issue">New issue</button>' : '<a class="btn" href="' + safeUrl(repoData.html_url) + '/issues/new" target="_blank" rel="noopener">去 GitHub 反馈</a>') + '</div></div>' +
      '<div class="issue-form" id="issueFormWrap" hidden><h3>新建 Issue</h3><form id="issueForm" data-owner="' + esc(owner) + '" data-repo="' + esc(repo) + '">' +
        '<div class="field"><label for="issueTitle">标题</label><input class="input" id="issueTitle" name="title" required maxlength="256" placeholder="哪里有问题？"></div>' +
        '<div class="field"><label for="issueBody">描述</label><textarea class="input" id="issueBody" name="body" placeholder="补充复现步骤、截图或想法"></textarea></div>' +
        '<div class="form-actions"><button class="btn primary" type="submit">提交 Issue</button><button class="btn ghost" type="button" data-action="toggle-issue">取消</button></div><div id="issueMsg"></div></form></div>' +
      '<div class="panel">' + (items.length ? items.map(issueRow).join('') : '<div class="empty" style="border:0"><div style="color:#656d76;display:flex;justify-content:center">' + icon('issue',36,'') + '</div><h3>欢迎来到 Issues</h3><p>这里还没有问题。有 bug 或想法，直接开一个。</p>' + (canIssue ? '<button class="btn primary" data-action="toggle-issue">New issue</button>' : '<a class="btn" href="' + safeUrl(repoData.html_url) + '/issues/new" target="_blank" rel="noopener">去 GitHub 反馈</a>') + '</div>') + '</div>' +
    '</div><aside><div class="side-card"><h3>关于 Issues</h3><p>Issue 会真的写到 GitHub，评论区在 GitHub 页面继续。</p><a href="' + safeUrl(repoData.html_url) + '/issues" target="_blank" rel="noopener">在 GitHub 查看全部</a></div></aside></div></section>';
}
function issueRow(issue){
  const statePill = issue.state === 'open' ? '<span class="pill green">Open</span>' : '<span class="pill" style="color:#8250df;border-color:#d8b9ff;background:#fbefff">Closed</span>';
  return '<div class="issue-row"><span class="ic">' + icon('issue',16) + '</span><div class="grow"><b><a href="' + safeUrl(issue.html_url) + '" target="_blank" rel="noopener">' + esc(issue.title) + '</a></b> ' + statePill +
    '<div class="meta">#' + issue.number + ' · ' + esc(issue.user ? issue.user.login : '') + ' · ' + timeAgo(issue.created_at) + ' · ' + (issue.comments||0) + ' 条评论</div></div></div>';
}

function slugify(text){
  return String(text || '').toLowerCase().trim()
    .replace(/[^a-z0-9._-]+/g, '-').replace(/-+/g, '-').replace(/^[-._]+|[-._]+$/g, '').slice(0, 40);
}

function updatePreview(){
  const form = document.getElementById('newSiteForm');
  if(!form) return;
  const frame = document.getElementById('sitePreview');
  if(!frame) return;
  const custom = form.useCustom && form.useCustom.checked ? (form.siteCustom ? form.siteCustom.value : '') : '';

/* ===== 建站动作 ===== */
async function repoExists(owner, name){
  try{ await api('/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(name)); return true; }
  catch(e){ if(e.status === 404) return false; throw e; }
}
async function putFile(owner, repo, path, content, message, branch, sha){
  const body = {message, content: b64encode(content), branch};
  if(sha) body.sha = sha;
  return api('/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/contents/' + encodePath(path), {method:'PUT', body});
}
function logLine(box, text, kind){
  const div = document.createElement('div');
  div.className = 'log-line ' + (kind || '');
  div.innerHTML = '<span class="ic">' + icon(kind === 'ok' ? 'check' : kind === 'err' ? 'alert' : 'clock', 16) + '</span><span>' + esc(text) + '</span>';
  box.appendChild(div);
  div.scrollIntoView({block:'nearest'});
}
async function createSite(form){
  const box = document.getElementById('buildLog');
  const btn = form.querySelector('button[type=submit]');
  const name = (form.siteName.value || '').trim();
  const title = (form.siteTitle.value || '').trim();
  const desc = (form.siteDesc.value || '').trim();
  const tagline = (form.siteTagline.value || '').trim();
  const about = (form.siteAbout.value || '').trim();
  const template = (form.querySelector('input[name=template]:checked') || {}).value || 'profile';
  const accent = form.siteAccent.value || '#1f883d';
  const custom = form.useCustom.checked ? (form.siteCustom.value || '').trim() : '';
  if(!state.me) { location.hash = '#/connect'; return; }
  if(!name || !title){ showToast('仓库名和站点标题必填'); return; }
  if(!/^[a-zA-Z0-9][a-zA-Z0-9._-]{0,38}$/.test(name)){ showToast('仓库名只能用英文、数字、- _ .'); return; }
  if(custom && !/<!doctype|<html/i.test(custom)){ showToast('自定义 HTML 需要是完整的网页'); return; }
  box.hidden = false;
  box.innerHTML = '<h3>正在建站</h3>';
  btn.disabled = true;
  const setBtn = t => { btn.textContent = t; };
  setBtn('处理中…');
  try{
    logLine(box, '检查仓库名 ' + name + '…');
    const exists = await repoExists(state.me.login, name);
    if(exists) throw Object.assign(new Error('仓库 ' + name + ' 已经存在，换一个名字'), {status:422});
    const repo = await api('/user/repos', {method:'POST', body:{
      name, description: desc || title, private:false, has_issues:true, has_projects:false, has_wiki:false, auto_init:true
    }});
    const owner = repo.owner.login;
    const branch = repo.default_branch || 'main';
    logLine(box, '仓库已创建：' + owner + '/' + repo.name, 'ok');
    const html = custom || buildSiteHtml({title, tagline, about, template, accent}, owner, repo.name);
    let readmeSha = null;
    try{
      const current = await api('/repos/' + owner + '/' + repo.name + '/contents/README.md');
      readmeSha = current.sha;
    }catch(_){}
    const readme = '# ' + title + '\n\n' + (tagline ? tagline + '\n\n' : '') + (about ? about + '\n\n' : '') + '由 [GidHub](https://github.com/ACMagnus/gidhub) 建站。\n';
    await putFile(owner, repo.name, 'README.md', readme, 'site: 初始化说明', branch, readmeSha);
    await putFile(owner, repo.name, 'index.html', html, 'site: 初始化页面', branch);
    logLine(box, '已提交 README.md 与 index.html', 'ok');
    let pages;
    try{
      pages = await api('/repos/' + owner + '/' + repo.name + '/pages', {method:'POST', body:{source:{branch, path:'/'}}});
      logLine(box, 'GitHub Pages 已开启', 'ok');
    }catch(e){
      if(e.status === 409 || e.status === 422){
        pages = await api('/repos/' + owner + '/' + repo.name + '/pages');
        logLine(box, 'Pages 已经存在，复用现有配置', 'ok');
      }else throw e;
    }
    const url = (pages && pages.html_url) || ('https://' + owner.toLowerCase() + '.github.io/' + repo.name + '/');
    logLine(box, '站点地址：' + url, 'ok');
    logLine(box, '等待 Pages 完成第一次构建（通常 30–90 秒）…');
    let built = null;
    for(let i=0;i<20;i++){
      await sleep(3000);
      try{
        const p = await api('/repos/' + owner + '/' + repo.name + '/pages');
        if(p.status === 'built' || p.status === 'errored'){ built = p; break; }
      }catch(e){ if(e.status !== 404) throw e; }
    }
    if(built && built.status === 'errored') logLine(box, 'Pages 构建报错，去仓库 Actions 看日志', 'err');
    else if(built) logLine(box, 'Pages 构建完成', 'ok');
    else logLine(box, '构建还在排队，网址已经生效，稍等刷新即可', '');
    clearCache();
    const done = document.createElement('div');
    done.className = 'build-result';
    done.innerHTML = '<b>站点已创建</b><span class="small muted">' + esc(owner) + '/' + esc(repo.name) + ' · 已开启 Pages</span>' +
      '<div class="result-url"><a href="' + safeUrl(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a></div>' +
      '<div class="r-actions"><a class="btn primary" href="' + safeUrl(url) + '" target="_blank" rel="noopener">打开站点</a>' +
        '<a class="btn" href="' + repoHash(owner, repo.name) + '">管理仓库</a>' +
        '<a class="btn" href="https://github.com/' + owner + '/' + repo.name + '" target="_blank" rel="noopener">' + icon('external',14) + ' GitHub</a></div>';
    box.appendChild(done);
    btn.disabled = false;
    setBtn('创建并发布到 GitHub Pages');
    form.siteName.value = '';
    updateHeader();
  }catch(e){
    logLine(box, apiErrorMessage(e), 'err');
    if(e.status === 403) logLine(box, '检查 key 权限：创建仓库需要 repo 或 Administration 写权限，Pages 需要 Pages 写权限。', '');
    if(e.status === 422) logLine(box, '换一个仓库名，或去 GitHub 检查是否重名。', '');
    btn.disabled = false;
    setBtn('创建并发布到 GitHub Pages');
    showToast('建站失败：' + apiErrorMessage(e));
  }
}

/* ===== 动作绑定 ===== */
async function handleAction(el){
  const action = el.dataset.action;
  if(action === 'refresh'){ clearCache(); render(); return; }
  if(action === 'toggle-clone'){
    const pop = document.getElementById('clonePop');
    if(pop) pop.style.display = pop.style.display === 'none' ? 'block' : 'none';
    return;
  }
  if(action === 'copy'){
    const text = el.dataset.copy || '';
    try{ await navigator.clipboard.writeText(text); }
    catch(_){ const i = document.getElementById('cloneUrl'); if(i){ i.select(); document.execCommand('copy'); } }
    showToast('已复制'); return;
  }
  if(action === 'disconnect'){
    disconnectToken();
    state.authError = '';
    showToast('已断开，key 已从本机删除');
    render();
    return;
  }
  if(action === 'toggle-issue'){
    const box = document.getElementById('issueFormWrap');
    if(box){ box.hidden = !box.hidden; if(!box.hidden){ const t = document.getElementById('issueTitle'); if(t) t.focus(); } }
    return;
  }
  if(action === 'delete-file'){
    if(!confirm('确定删除 ' + el.dataset.path + '？这会生成一次真实提交。')) return;
    const {owner, repo, path, branch, sha} = el.dataset;
    el.disabled = true;
    try{
      await api('/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/contents/' + encodePath(path), {method:'DELETE', body:{message:'delete ' + path, sha, branch}});
      clearCache();
      showToast('已删除');
      location.hash = repoHash(owner, repo);
    }catch(e){
      el.disabled = false;
      showToast('删除失败：' + apiErrorMessage(e));
    }
    return;
  }
  if(action === 'accent'){
    const color = el.dataset.accent;
    const input = document.getElementById('siteAccent');
    if(input){ input.value = color; }
    document.querySelectorAll('.swatch').forEach(s => s.dataset.on = s.dataset.accent === color ? '1' : '0');
    updatePreview();
    return;
  }
}

document.getElementById('app').addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  if(el.closest('a[href]') && el.tagName !== 'BUTTON') return;
  e.preventDefault();
  handleAction(el);
});

document.addEventListener('submit', async function(e){
  const form = e.target;
  e.preventDefault();

    const input = document.getElementById('tokenInput');

      showToast('已连接 @' + state.me.login);

      state.me = null;
      localStorage.removeItem(LS_TOKEN);

      btn.disabled = false; btn.textContent = '验证并保存';
    }
    return;
  }
  if(form.id === 'newSiteForm'){
    await createSite(form);

  }
  if(form.id === 'fileForm'){

    const path = (document.getElementById('filePath').value || '').trim();
    const content = document.getElementById('fileContent').value;
    const message = (document.getElementById('commitMsg').value || '').trim() || (old ? 'update ' + old : 'add ' + path);
    if(!path){ showToast('填文件路径'); return; }
    btn.disabled = true;
    try{
      await putFile(owner, repo, path, content, message, branch, sha || undefined);
      clearCache();
      showToast('已提交');
      location.hash = repoHash(owner, repo) + '/blob/' + encodePath(path) + '?branch=' + encodeURIComponent(branch);
    }catch(err){
      btn.disabled = false;
      if(msg) msg.innerHTML = '<div class="err-box">' + esc(apiErrorMessage(err)) + '</div>';
      showToast('提交失败：' + apiErrorMessage(err));
    }
    return;
  }
  if(form.id === 'issueForm'){
    const btn = form.querySelector('button[type=submit]');
    const msg = document.getElementById('issueMsg');
    const {owner, repo} = form.dataset;
    const title = (document.getElementById('issueTitle').value || '').trim();
    const body = (document.getElementById('issueBody').value || '').trim();
    if(!title){ showToast('填个标题'); return; }
    btn.disabled = true;
    try{
      await api('/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/issues', {method:'POST', body:{title, body}});
      clearCache();
      showToast('Issue 已创建');
      render();
    }catch(err){
      btn.disabled = false;
      if(msg) msg.innerHTML = '<div class="err-box">' + esc(apiErrorMessage(err)) + '</div>';
    }
    return;
  }
});

document.getElementById('app').addEventListener('input', function(e){
  if(e.target.closest('#newSiteForm')) updatePreview();
});
document.getElementById('app').addEventListener('change', function(e){
  if(e.target.closest('#newSiteForm')){
    if(e.target.id === 'useCustom'){
      const ta = document.getElementById('siteCustom');
      if(ta) ta.style.display = e.target.checked ? 'block' : 'none';
    }
    updatePreview();
  }
});
document.getElementById('app').addEventListener('click', function(e){
  const sw = e.target.closest('.swatch');
  if(sw) handleAction(sw);
  if(e.target.id === 'clonePop') e.stopPropagation();
}, true);

/* 点击外部关闭 clone 弹层 */
document.addEventListener('click', function(e){
  const pop = document.getElementById('clonePop');
  if(pop && pop.style.display === 'block' && !e.target.closest('#clonePop') && !e.target.closest('[data-action="toggle-clone"]')){
    pop.style.display = 'none';
  }
});

/* ===== 渲染 ===== */
async function render(){
  const seq = ++state.seq;
  const route = parseRoute();
  state.route = route;
  const app = document.getElementById('app');
  const seg = route.seg;
  const q = route.q;
  app.innerHTML = loading();

  let nav = 'home';
  if(seg[0] === 'new') nav = 'new';
  if(seg[0] === 'search') nav = 'search';
  setNav(nav);

  const topQ = document.getElementById('topQ');
  if(topQ && seg[0] === 'search') topQ.value = q.get('q') || '';
  const titleMap = {new:'新建站点 · GidHub', connect:'连接 GitHub · GidHub', search:'探索 · GidHub'};
  document.title = seg.length === 0 ? 'GidHub · 用 GitHub 真的建一个网站' : (titleMap[seg[0]] || (decodeURIComponent(location.hash.replace(/^#\//,'').replace(/\?.*$/,'')) + ' · GidHub'));

  try{
    let html = '';
    if(seg.length === 0) html = await viewHome();
    else if(seg[0] === 'new') html = await viewNew();
    else if(seg[0] === 'connect') html = await viewConnect();
    else if(seg[0] === 'search') html = await viewSearch(q);
    else if(seg.length === 1) html = await viewProfile(seg[0]);
    else{
      const [owner, repo] = seg;
      if(seg[2] === 'releases') html = await viewReleases(owner, repo);
      else if(seg[2] === 'issues') html = await viewIssues(owner, repo);
      else if(seg[2] === 'blob') html = await viewBlob(owner, repo, seg.slice(3).join('/'), q.get('branch'));
      else if(seg[2] === 'edit') html = await viewEdit(owner, repo, seg.slice(3).join('/'), q.get('branch'));
      else if(seg[2] === 'tree') html = await viewRepo(owner, repo, seg.slice(3).join('/'), q.get('branch'));
      else html = await viewRepo(owner, repo, '', q.get('branch'));
    }
    if(seq !== state.seq) return;
    app.innerHTML = html;
    if(seg[0] === 'new') updatePreview();
  }catch(e){
    if(seq !== state.seq) return;
    app.innerHTML = errorPage(e);
  }
}
window.addEventListener('hashchange', render);
window.addEventListener('popstate', render);

/* 首次进入 */
(async function init(){
  updateHeader();
  if(state.token){
    try{
      state.me = await verifyToken(state.token);
    }catch(e){
      state.authError = e.status === 401 ? 'GitHub key 已失效' : '无法验证 GitHub key';
      state.token = '';
      state.me = null;
      localStorage.removeItem(LS_TOKEN);
    }
  }
  updateHeader();
  render();
})();
</script>
